name: real-tool tests

# Runs the gated real-tool tests (MagicPEXAdapter / MagicBackendEndToEnd /
# MagicResistanceExtraction) against a real Magic + Sky130 toolchain, so the
# real PEX path is exercised on every push — not just on a developer's machine.
# Without the toolchain those tests skip; here they actually run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  realtool:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out the local package graph
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/1amageek/CircuiteFoundation.git ../CircuiteFoundation
          git clone --depth 1 --branch main https://github.com/1amageek/SignoffToolSupport.git ../SignoffToolSupport

      - name: Report Swift toolchain
        run: swift --version

      - name: Cache toolchain (Magic + Sky130 PDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/magic
            ~/.volare
          key: pex-toolchain-${{ runner.os }}-${{ hashFiles('scripts/install-toolchain.sh') }}

      - name: Install / detect toolchain
        run: bash scripts/install-toolchain.sh   # appends MAGIC_BIN / PDK_ROOT to $GITHUB_ENV

      - name: Doctor
        run: |
          test -x "$MAGIC_BIN" && echo "magic: $MAGIC_BIN"
          test -d "$PDK_ROOT/sky130A" && echo "pdk: $PDK_ROOT"

      - name: Run tests (gated real-tool tests now execute)
        run: perl -e 'alarm shift; exec @ARGV' 120 swift test
